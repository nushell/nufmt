[package]
name = "nufmt"
version = "0.1.6"
edition = "2024"
rust-version = "1.98.1"
description = "An AST-based formatter for Nushell scripts, built on Nushell's own parser"
homepage = "https://www.nushell.sh/"
repository = "https://github.com/nushell/nufmt"
license = "MIT"
keywords = ["cli", "formatting", "nu", "nushell"]
categories = ["command-line-utilities"]

[features]
default = ["bin"]
bin = ["clap"]

[lib]
name = "nu_formatter"

[[bin]]
name = "nufmt"
required-features = ["bin"]

[[bench]]
harness = false
name = "file-format-bench"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "unicode"], optional = true }
env_logger = "0.11.11"
ignore = "0.4.33"
log = "0.4.34"
nu-ansi-term = "0.50.3"
nu-cmd-lang = "0.117.0"
nu-parser = "0.117.0"
nu-protocol = "0.117.0"
nu-utils = "0.117.0"
nuon = "0.117.0"
rayon = "1.12.0"
thiserror = "2.0.21"

[dev-dependencies]
criterion = "0.8.2"
rstest = "0.27.0"
tempfile = "3.27.0"

[lints.clippy]
doc_markdown = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
