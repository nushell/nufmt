[package]
name = "nufmt"
version = "0.1.4"
edition = "2024"
rust-version = "1.98"
description = "Formats nushell extremely fast"
readme = "README.md"
repository = "https://github.com/nushell/nufmt"
license = "MIT"
keywords = ["cli", "formatting", "nu", "nushell"]
categories = ["command-line-utilities"]

[lib]
name = "nu_formatter"

[[bin]]
name = "nufmt"
required-features = ["bin"]

[[bench]]
harness = false
name = "file-format-bench"

[dependencies]
clap = { version = "4.6.6", features = ["derive", "unicode"], optional = true }
env_logger = "0.11.11"
ignore = "0.4.33"
log = "0.4.34"
nu-ansi-term = "0.50.3"
nu-cmd-lang = "0.115.1"
nu-parser = "0.115.1"
nu-protocol = "0.115.1"
nu-utils = "0.115.1"
nuon = "0.115.1"
rayon = "1.12.0"
thiserror = "2.0.20"

[dev-dependencies]
criterion = "0.8.2"
rstest = "0.26.1"
tempfile = "3.27.0"

[features]
default = ["bin"]
bin = ["dep:clap"]
